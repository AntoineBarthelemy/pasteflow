name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code quality and tests
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Check code formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build with analyzers
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --logger trx --results-directory TestResults --collect "XPlat Code Coverage"

      - name: Summarize test results
        if: always()
        shell: pwsh
        run: |
          # Informational only: a problem here must not hide the result of the tests, it is shown as a warning
          try {
            $total = 0; $passed = 0; $failed = 0
            Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              [xml]$trx = Get-Content -Raw -Encoding utf8 $_.FullName
              $counters = $trx.TestRun.ResultSummary.Counters
              $total += [int]$counters.total
              $passed += [int]$counters.passed
              $failed += [int]$counters.failed
              foreach ($result in @($trx.TestRun.Results.UnitTestResult) | Where-Object { $_ -and $_.outcome -eq 'Failed' }) {
                $reason = ([string]$result.Output.ErrorInfo.Message -replace '\s+', ' ')
                if ($reason.Length -gt 400) { $reason = $reason.Substring(0, 400) }
                Write-Output "::error title=Test failed::$($result.testName) : $reason"
              }
            }
            Write-Output "::notice title=Tests::$passed of $total tests passed, $failed failed"
          }
          catch {
            $message = ($_.Exception.Message -replace '\s+', ' ')
            Write-Output "::warning title=Test summary unavailable::$message"
          }

      - name: Keep test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  commit-messages:
    name: Conventional commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit messages
        shell: bash
        run: |
          pattern='^(build|ci|chore|docs|feat|fix|perf|refactor|revert|style|test)(\([^()[:space:]]+\))?!?: [^[:space:]].{2,}[^.[:space:]]$'
          status=0
          while IFS= read -r subject; do
            if ! [[ "$subject" =~ $pattern ]] || [ ${#subject} -gt 100 ]; then
              echo "::error::Invalid commit message: $subject"
              status=1
            fi
          done < <(git log --format=%s "origin/${{ github.base_ref }}..HEAD" --no-merges)
          exit $status
