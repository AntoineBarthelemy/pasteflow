name: Reference data

# Rebuilds the lists of first names, communes and countries embedded in PasteFlow.Core from the official sources.
# Run by hand when the sources are updated (once a year): the lists are pushed to the "reference-data" branch,
# to be reviewed and brought into main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build reference lists
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Download and compact the official data
        run: dotnet run --project tools/PasteFlow.DataBuilder --configuration Release -- src/PasteFlow.Core/Data

      - name: Push the lists to the reference-data branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B reference-data
          git add src/PasteFlow.Core/Data
          git commit -m "chore(data): update reference lists from official sources"
          git push --force origin reference-data
